<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cursed Reels — Halloween Slot</title>
<style>
  :root{
    --orange:#ff7a1a;
    --purple:#6b1fb3;
    --black:#0b0710;
    --gold:#ffd166;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at 50% 20%, #2b0f3a 0%, #0b0710 70%);
    font-family:'Trebuchet MS', 'Segoe UI', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#fff;
    overflow:hidden;
  }
  h1{
    font-size:2.6rem;
    margin:10px 0 2px;
    color:var(--orange);
    text-shadow:0 0 12px var(--orange), 0 0 24px #ff3d00;
    letter-spacing:3px;
    font-family:'Georgia', serif;
  }
  .sub{
    color:var(--gold);
    margin-bottom:14px;
    letter-spacing:2px;
    font-size:.85rem;
    text-transform:uppercase;
    opacity:.8;
  }
  .frame{
    background:linear-gradient(160deg,#1a0f26,#120817);
    border:6px solid var(--orange);
    border-radius:18px;
    box-shadow:0 0 30px rgba(255,122,26,.5), inset 0 0 40px rgba(107,31,179,.5);
    padding:18px;
    position:relative;
  }
  .frame::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:18px;
    pointer-events:none;
    box-shadow:0 0 0 2px #ffd166 inset;
    opacity:.3;
  }
  .reels{
    display:grid;
    grid-template-columns:repeat(5,86px);
    grid-template-rows:repeat(3,86px);
    gap:8px;
    background:#05030a;
    padding:10px;
    border-radius:10px;
    border:2px solid var(--purple);
  }
  .cell{
    width:86px;
    height:86px;
    background:linear-gradient(145deg,#1f1430,#0d0714);
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.6rem;
    position:relative;
    overflow:hidden;
    border:1px solid #3a2550;
  }
  .cell.win{
    animation:pulse .6s infinite alternate;
    border:1px solid var(--gold);
  }
  @keyframes pulse{
    from{box-shadow:0 0 6px var(--gold);}
    to{box-shadow:0 0 22px var(--gold), 0 0 40px var(--orange);}
  }
  .spinning .sym{
    animation:spinBlur .12s linear infinite;
  }
  @keyframes spinBlur{
    0%{transform:translateY(0);}
    100%{transform:translateY(8px);}
  }
  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-top:16px;
    width:100%;
  }
  .stat{
    background:#120817;
    border:2px solid var(--purple);
    border-radius:10px;
    padding:8px 16px;
    text-align:center;
    min-width:90px;
  }
  .stat .label{font-size:.65rem;color:var(--gold);letter-spacing:1px;text-transform:uppercase;opacity:.8;}
  .stat .value{font-size:1.2rem;font-weight:bold;}
  button{
    background:linear-gradient(180deg,var(--orange),#b84d00);
    border:none;
    color:#fff;
    font-weight:bold;
    font-size:1rem;
    padding:14px 34px;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 4px 0 #7a3100, 0 0 18px rgba(255,122,26,.6);
    letter-spacing:1px;
    text-transform:uppercase;
    transition:transform .05s;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #7a3100;}
  button:disabled{opacity:.5;cursor:default;}
  .bet-btn{
    background:#1f1430;
    border:2px solid var(--purple);
    color:#fff;
    width:34px;height:34px;
    border-radius:50%;
    font-size:1rem;
    padding:0;
    box-shadow:none;
  }
  .message{
    min-height:30px;
    margin-top:12px;
    font-size:1.2rem;
    color:var(--gold);
    text-shadow:0 0 10px var(--gold);
    letter-spacing:1px;
    text-align:center;
  }
  .footer-note{
    margin-top:18px;
    font-size:.7rem;
    color:#8a7a9a;
    text-align:center;
    max-width:460px;
    line-height:1.4;
  }
  .ghost{
    position:absolute;
    font-size:1.4rem;
    opacity:.15;
    pointer-events:none;
  }
</style>
</head>
<body>

<h1>🎃 CURSED REELS 🎃</h1>
<div class="sub">Haunted Jackpot Slots</div>

<div class="frame">
  <div class="reels" id="reels"></div>
  <div class="controls">
    <div class="stat">
      <div class="label">Balance</div>
      <div class="value" id="balance">1000</div>
    </div>
    <div class="stat">
      <div class="label">Bet</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button class="bet-btn" id="betDown">-</button>
        <div class="value" id="bet">10</div>
        <button class="bet-btn" id="betUp">+</button>
      </div>
    </div>
    <button id="spinBtn">SPIN</button>
    <div class="stat">
      <div class="label">Win</div>
      <div class="value" id="lastWin">0</div>
    </div>
  </div>
  <div class="message" id="message">Place your bet and spin the cursed reels...</div>
</div>

<div class="footer-note">
  Demo build — "Cursed Reels" Halloween Slot Template. 5x3 reels, wild &amp; scatter symbols,
  animated wins, fully configurable paytable. Source template available for licensing.
</div>

<script>
const SYMBOLS = ["🎃","👻","🧙","💀","🦇","🐈‍⬛","🍬"];
const WILD = "🎃"; // pumpkin acts as wild
const SCATTER = "🦇"; // bat acts as scatter

const PAYTABLE = {
  "🎃": 50, // wild/jackpot symbol
  "👻": 25,
  "🧙": 20,
  "💀": 15,
  "🦇": 10, // also scatter
  "🐈‍⬛": 8,
  "🍬": 5
};

const ROWS = 3, COLS = 5;
let balance = 1000;
let bet = 10;
let grid = [];
let spinning = false;

const reelsEl = document.getElementById('reels');
const balanceEl = document.getElementById('balance');
const betEl = document.getElementById('bet');
const lastWinEl = document.getElementById('lastWin');
const messageEl = document.getElementById('message');
const spinBtn = document.getElementById('spinBtn');

function randSymbol(){
  return SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
}

function buildGrid(){
  reelsEl.innerHTML = "";
  grid = [];
  for(let r=0;r<ROWS;r++){
    const row = [];
    for(let c=0;c<COLS;c++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      const span = document.createElement('div');
      span.className = 'sym';
      const s = randSymbol();
      span.textContent = s;
      cell.appendChild(span);
      reelsEl.appendChild(cell);
      row.push(s);
    }
    grid.push(row);
  }
}

function paylines(){
  // 5 simple horizontal lines (one per row) + 2 diagonals for flavor
  const lines = [];
  for(let r=0;r<ROWS;r++){
    lines.push([[r,0],[r,1],[r,2],[r,3],[r,4]]);
  }
  lines.push([[0,0],[1,1],[2,2],[1,3],[0,4]]);
  lines.push([[2,0],[1,1],[0,2],[1,3],[2,4]]);
  return lines;
}

function evaluate(){
  let totalWin = 0;
  const winCells = new Set();
  const lines = paylines();
  for(const line of lines){
    const syms = line.map(([r,c])=>grid[r][c]);
    const first = syms[0] === WILD ? syms.find(s=>s!==WILD) || WILD : syms[0];
    let count = 0;
    for(const s of syms){
      if(s === first || s === WILD) count++;
      else break;
    }
    if(count >= 3){
      const payout = PAYTABLE[first] * count * (bet/10);
      totalWin += payout;
      for(let i=0;i<count;i++){
        winCells.add(line[i][0]+"-"+line[i][1]);
      }
    }
  }
  // scatter bonus: 3+ bats anywhere
  const scatterCount = grid.flat().filter(s=>s===SCATTER).length;
  if(scatterCount >= 3){
    totalWin += PAYTABLE[SCATTER] * scatterCount * (bet/10);
    grid.forEach((row,r)=>row.forEach((s,c)=>{if(s===SCATTER) winCells.add(r+"-"+c);}));
  }
  return {totalWin: Math.round(totalWin), winCells};
}

function renderGrid(){
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell = document.getElementById(`cell-${r}-${c}`);
      cell.classList.remove('win');
      cell.querySelector('.sym').textContent = grid[r][c];
    }
  }
}

function highlightWins(winCells){
  winCells.forEach(key=>{
    const [r,c] = key.split('-');
    document.getElementById(`cell-${r}-${c}`).classList.add('win');
  });
}

async function spin(){
  if(spinning) return;
  if(balance < bet){
    messageEl.textContent = "Not enough souls... lower your bet.";
    return;
  }
  spinning = true;
  spinBtn.disabled = true;
  balance -= bet;
  balanceEl.textContent = balance;
  lastWinEl.textContent = "0";
  messageEl.textContent = "The reels are cursed... spinning...";

  reelsEl.classList.add('spinning');

  // spin animation: rapidly change symbols for ~900ms
  const spinDuration = 900;
  const interval = setInterval(()=>{
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        document.getElementById(`cell-${r}-${c}`).querySelector('.sym').textContent = randSymbol();
      }
    }
  }, 80);

  await new Promise(res=>setTimeout(res, spinDuration));
  clearInterval(interval);
  reelsEl.classList.remove('spinning');

  // final grid
  grid = [];
  for(let r=0;r<ROWS;r++){
    const row = [];
    for(let c=0;c<COLS;c++) row.push(randSymbol());
    grid.push(row);
  }
  renderGrid();

  const {totalWin, winCells} = evaluate();
  if(totalWin > 0){
    balance += totalWin;
    balanceEl.textContent = balance;
    lastWinEl.textContent = totalWin;
    highlightWins(winCells);
    messageEl.textContent = totalWin >= bet*10
      ? "🎃 CURSED JACKPOT! The spirits reward you! 🎃"
      : "You win! The pumpkin spirits smile upon you.";
  } else {
    messageEl.textContent = "The curse holds... spin again.";
  }

  spinning = false;
  spinBtn.disabled = false;
}

document.getElementById('betUp').onclick = ()=>{
  bet = Math.min(bet+10, 100);
  betEl.textContent = bet;
};
document.getElementById('betDown').onclick = ()=>{
  bet = Math.max(bet-10, 10);
  betEl.textContent = bet;
};
spinBtn.onclick = spin;

buildGrid();
</script>
</body>
</html>
